
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sparkle Tutor — your thinking buddy</title>
  <meta name="description" content="A friendly AI tutor for kids 6–12 that guides you to the answer with small steps, hints, and colorful pictures — never just the answer." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet" />
  <style data-od-inline-asset="css/tutor.css">
/* =====================================================================
   Sparkle Tutor — kid-friendly AI-tutor chat (ages 6–12)
   Design system: sky-white canvas, indigo ink, coral (child) + teal
   (tutor) accents, green/amber status. Rounded display, readable body.
   No indigo-#6366f1 slop, no gradient wash, no emoji-as-icon in headings.
   ===================================================================== */

:root {
  /* neutrals (70–90% of pixels) */
  --bg:      oklch(98% 0.012 235);   /* soft sky white */
  --bg-2:    oklch(95% 0.02 235);    /* rail / recessed */
  --surface: oklch(100% 0 0);        /* cards, bubbles */
  --fg:      oklch(30% 0.06 265);    /* indigo ink */
  --muted:   oklch(52% 0.04 265);
  --border:  oklch(90% 0.02 250);

  /* accents — coral = child/you, teal = tutor. Each capped ~2 uses/region */
  --child:      oklch(66% 0.16 32);   /* warm coral */
  --child-soft: oklch(94% 0.05 40);
  --tutor:      oklch(64% 0.11 195);  /* friendly teal */
  --tutor-soft: oklch(95% 0.035 195);

  /* semantic status */
  --success:      oklch(68% 0.15 150);
  --success-soft: oklch(94% 0.06 150);
  --warn:         oklch(78% 0.14 75);
  --warn-soft:    oklch(95% 0.06 80);

  /* subject hues (used only on subject chips + aid headers) */
  --math:    oklch(64% 0.14 265);
  --reading: oklch(66% 0.15 340);
  --science: oklch(64% 0.13 160);
  --curio:   oklch(72% 0.14 60);

  --radius:   18px;
  --radius-lg: 26px;
  --radius-pill: 999px;

  --font-display: 'Baloo 2', 'Fredoka', 'Nunito', 'Segoe UI Rounded',
                  system-ui, -apple-system, sans-serif;
  --font-body: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI',
               system-ui, sans-serif;

  --shadow-sm: 0 2px 6px oklch(50% 0.05 265 / 0.08);
  --shadow-md: 0 8px 24px oklch(50% 0.08 265 / 0.12);
  --shadow-pop: 0 12px 40px oklch(50% 0.1 265 / 0.16);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }

body {
  font-family: var(--font-body);
  color: var(--fg);
  background:
    radial-gradient(1100px 640px at 92% -12%, var(--tutor-soft), transparent 58%),
    var(--bg);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
  font-size: 16px;
  line-height: 1.5;
}

h1, h2, h3, .display { font-family: var(--font-display); letter-spacing: -0.01em; }

/* ---------------------------------------------------------------- shell */
.app {
  display: grid;
  grid-template-columns: 1fr;
  grid-template-rows: auto 1fr;
  height: 100dvh;
  max-width: 1500px;
  margin-inline: auto;
}

.topbar {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px clamp(14px, 3vw, 28px);
  background: color-mix(in oklch, var(--surface) 82%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 20;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(19px, 2.4vw, 24px);
}
.brand .logo {
  width: 42px; height: 42px;
  display: grid; place-items: center;
  background: var(--tutor-soft);
  border-radius: 14px;
  color: var(--tutor);
  flex: none;
}
.brand .logo svg { width: 26px; height: 26px; }
.brand small {
  display: block;
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 0.02em;
  color: var(--muted);
}
.topbar .spacer { flex: 1; }

.btn-ghost {
  font-family: var(--font-body);
  font-weight: 800;
  font-size: 14px;
  color: var(--muted);
  background: transparent;
  border: 2px solid var(--border);
  border-radius: var(--radius-pill);
  padding: 9px 16px;
  min-height: 44px;
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px;
  transition: transform .12s ease, border-color .12s ease, color .12s;
}
.btn-ghost:hover { border-color: var(--tutor); color: var(--tutor); }
.btn-ghost:active { transform: translateY(1px); }
.btn-ghost svg { width: 18px; height: 18px; }

/* ---------------------------------------------------------------- body grid */
.main {
  display: grid;
  grid-template-columns: 1fr;
  min-height: 0;
  overflow: hidden;
}

/* subject rail — becomes a scroll strip on mobile */
.rail {
  display: flex;
  gap: 10px;
  padding: 12px clamp(14px, 3vw, 20px);
  overflow-x: auto;
  scrollbar-width: none;
  background: color-mix(in oklch, var(--bg-2) 60%, transparent);
  border-bottom: 1px solid var(--border);
}
.rail::-webkit-scrollbar { display: none; }
.rail .rail-title { display: none; }

.subject {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 10px 16px;
  min-height: 44px;
  border-radius: var(--radius-pill);
  border: 2px solid var(--border);
  background: var(--surface);
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 15px;
  color: var(--fg);
  cursor: pointer;
  white-space: nowrap;
  transition: transform .12s ease, border-color .12s, background .12s;
}
.subject .ic { width: 22px; height: 22px; display: grid; place-items: center; flex: none; }
.subject .ic svg { width: 22px; height: 22px; }
.subject[data-subject="math"]    .ic { color: var(--math); }
.subject[data-subject="reading"] .ic { color: var(--reading); }
.subject[data-subject="science"] .ic { color: var(--science); }
.subject[data-subject="curio"]   .ic { color: var(--curio); }
.subject:hover { transform: translateY(-2px); }
.subject[aria-pressed="true"] {
  border-color: currentColor;
  background: color-mix(in oklch, var(--surface) 84%, var(--tutor-soft));
}
.subject[data-subject="math"][aria-pressed="true"]    { color: var(--math);    background: color-mix(in oklch,#fff 86%, var(--math)); }
.subject[data-subject="reading"][aria-pressed="true"] { color: var(--reading); background: color-mix(in oklch,#fff 86%, var(--reading)); }
.subject[data-subject="science"][aria-pressed="true"] { color: var(--science); background: color-mix(in oklch,#fff 86%, var(--science)); }
.subject[data-subject="curio"][aria-pressed="true"]   { color: var(--curio);   background: color-mix(in oklch,#fff 86%, var(--curio)); }
.subject[aria-pressed="true"] .label { color: var(--fg); }

/* chat column */
.chat {
  display: flex;
  flex-direction: column;
  min-height: 0;
  min-width: 0;
}

.stream {
  flex: 1;
  overflow-y: auto;
  padding: clamp(14px, 3vw, 26px);
  display: flex;
  flex-direction: column;
  gap: 16px;
  scroll-behavior: smooth;
}
.stream::-webkit-scrollbar { width: 10px; }
.stream::-webkit-scrollbar-thumb {
  background: var(--border); border-radius: 999px; border: 3px solid transparent; background-clip: padding-box;
}

/* ---------------------------------------------------------------- messages */
.msg { display: flex; gap: 12px; max-width: 760px; }
.msg.you { align-self: flex-end; flex-direction: row-reverse; }
.msg.tutor { align-self: flex-start; }

.avatar {
  width: 40px; height: 40px; border-radius: 50%;
  display: grid; place-items: center; flex: none;
  box-shadow: var(--shadow-sm);
}
.msg.tutor .avatar { background: var(--tutor-soft); color: var(--tutor); }
.msg.you   .avatar { background: var(--child-soft); color: var(--child); }
.avatar svg { width: 24px; height: 24px; }

.bubble {
  padding: 14px 18px;
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  font-size: clamp(15px, 1.6vw, 17px);
  line-height: 1.55;
}
.msg.tutor .bubble {
  background: var(--surface);
  border-top-left-radius: 8px;
}
.msg.you .bubble {
  background: var(--child);
  color: #fff;
  border-top-right-radius: 8px;
  font-weight: 700;
}
.bubble p + p { margin-top: 8px; }
.bubble strong { font-weight: 800; }
.bubble .lead { font-family: var(--font-display); font-weight: 600; }

/* step card inside a tutor bubble */
.steps { margin-top: 12px; display: grid; gap: 10px; }
.step {
  display: grid;
  grid-template-columns: 34px 1fr;
  gap: 12px;
  align-items: start;
  padding: 12px 14px;
  border-radius: var(--radius);
  background: var(--tutor-soft);
  border: 2px solid transparent;
  opacity: .55;
  transition: opacity .25s, border-color .25s, transform .25s;
}
.step.revealed { opacity: 1; }
.step.current { border-color: var(--tutor); transform: translateX(2px); }
.step.done { background: var(--success-soft); }
.step .num {
  width: 34px; height: 34px; border-radius: 50%;
  display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 700;
  background: var(--surface); color: var(--tutor);
  box-shadow: var(--shadow-sm); flex: none;
}
.step.done .num { background: var(--success); color: #fff; }
.step .body .q { font-weight: 800; }
.step .body .tip { color: var(--muted); font-size: 14px; margin-top: 2px; }

/* hint chips row */
.chips { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 2px solid var(--border);
  background: var(--surface);
  color: var(--fg);
  border-radius: var(--radius-pill);
  padding: 8px 14px;
  min-height: 40px;
  font-family: var(--font-display);
  font-weight: 600; font-size: 14px;
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 7px;
  transition: transform .12s, border-color .12s, background .12s;
}
.chip:hover { transform: translateY(-1px); border-color: var(--tutor); }
.chip svg { width: 16px; height: 16px; }
.chip.hint   { border-color: color-mix(in oklch,#fff 55%, var(--warn)); color: oklch(52% 0.13 60); background: var(--warn-soft); }
.chip.reveal { border-color: color-mix(in oklch,#fff 55%, var(--child)); color: var(--child); }

/* encouraging feedback banner */
.cheer {
  display: inline-flex; align-items: center; gap: 10px;
  align-self: flex-start;
  background: var(--success-soft);
  color: oklch(42% 0.12 150);
  border-radius: var(--radius-pill);
  padding: 10px 18px;
  font-family: var(--font-display); font-weight: 700;
  box-shadow: var(--shadow-sm);
  animation: pop .35s ease;
}
.cheer.try { background: var(--warn-soft); color: oklch(48% 0.12 65); }
.cheer svg { width: 22px; height: 22px; }
@keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* ---------------------------------------------------------------- visual aids */
.aid {
  margin-top: 12px;
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  overflow: hidden;
}
.aid h4 {
  font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 10px; display: flex; align-items: center; gap: 7px;
}
.aid h4 svg { width: 16px; height: 16px; }

/* number blocks */
.blocks { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; }
.block-group { display: flex; flex-direction: column; gap: 6px; align-items: center; }
.block-group .cap { font-family: var(--font-display); font-weight: 700; font-size: 14px; }
.tens { display: flex; gap: 5px; flex-wrap: wrap; max-width: 220px; }
.ones { display: flex; gap: 4px; flex-wrap: wrap; max-width: 130px; }
.rod {
  width: 16px; height: 80px; border-radius: 5px;
  background: color-mix(in oklch, #fff 30%, var(--math));
  box-shadow: inset 0 -6px 0 oklch(40% 0.14 265 / .35);
  animation: rise .4s ease backwards;
}
.cube {
  width: 16px; height: 16px; border-radius: 4px;
  background: color-mix(in oklch, #fff 25%, var(--curio));
  box-shadow: inset 0 -3px 0 oklch(50% 0.12 60 / .4);
  animation: rise .4s ease backwards;
}
@keyframes rise { from { transform: translateY(10px) scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
.plus-sign { font-family: var(--font-display); font-weight: 800; font-size: 32px; color: var(--muted); align-self: center; }

/* letter / phoneme tiles */
.tiles { display: flex; flex-wrap: wrap; gap: 8px; }
.tile {
  min-width: 46px; height: 54px; padding: 0 10px;
  border-radius: 12px;
  display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 800; font-size: 24px;
  background: color-mix(in oklch, #fff 80%, var(--reading));
  color: oklch(38% 0.16 340);
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  animation: rise .35s ease backwards;
  transition: transform .12s;
}
.tile:hover { transform: translateY(-3px) rotate(-2deg); }
.tile.vowel { background: color-mix(in oklch, #fff 70%, var(--warn)); color: oklch(45% 0.13 65); }
.tile .sound { display: block; font-family: var(--font-body); font-weight: 700; font-size: 11px; opacity: .7; }

/* science diagram wrap */
.diagram { display: grid; place-items: center; }
.diagram svg { width: 100%; max-width: 360px; height: auto; }

/* thinking dots */
.thinking { display: inline-flex; gap: 5px; padding: 4px 2px; }
.thinking span {
  width: 9px; height: 9px; border-radius: 50%; background: var(--tutor);
  animation: bob 1s infinite ease-in-out;
}
.thinking span:nth-child(2) { animation-delay: .15s; }
.thinking span:nth-child(3) { animation-delay: .3s; }
@keyframes bob { 0%,80%,100% { transform: translateY(0); opacity: .4; } 40% { transform: translateY(-6px); opacity: 1; } }

/* ---------------------------------------------------------------- composer */
.composer {
  border-top: 1px solid var(--border);
  background: color-mix(in oklch, var(--surface) 85%, transparent);
  backdrop-filter: blur(10px);
  padding: clamp(12px, 2.5vw, 18px) clamp(14px, 3vw, 26px);
}
.suggests { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
.suggests::-webkit-scrollbar { display: none; }
.suggests button {
  flex: none; border: 2px dashed var(--border); background: transparent;
  color: var(--muted); border-radius: var(--radius-pill);
  padding: 7px 14px; min-height: 40px; font-weight: 700; font-size: 13px; cursor: pointer;
  transition: color .12s, border-color .12s;
}
.suggests button:hover { color: var(--tutor); border-color: var(--tutor); }

.composer form {
  display: flex; gap: 10px; align-items: flex-end;
}
.field {
  flex: 1;
  display: flex; align-items: center; gap: 8px;
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 6px 6px 6px 16px;
  transition: border-color .15s, box-shadow .15s;
}
.field:focus-within { border-color: var(--tutor); box-shadow: 0 0 0 4px var(--tutor-soft); }
.field textarea {
  flex: 1; border: 0; outline: 0; resize: none;
  font-family: var(--font-body); font-size: 16px; color: var(--fg);
  background: transparent; max-height: 120px; line-height: 1.4; padding: 10px 0;
}
.field textarea::placeholder { color: var(--muted); }
.send {
  width: 48px; height: 48px; border-radius: 50%; border: 0; flex: none;
  background: var(--child); color: #fff; cursor: pointer;
  display: grid; place-items: center;
  box-shadow: var(--shadow-md);
  transition: transform .12s, filter .12s;
}
.send:hover { filter: brightness(1.05); }
.send:active { transform: scale(.92); }
.send:disabled { opacity: .4; cursor: default; }
.send svg { width: 22px; height: 22px; }

/* ================================================================ tablet + up */
@media (min-width: 768px) {
  .main { grid-template-columns: 244px 1fr; }
  .rail {
    flex-direction: column;
    overflow-x: visible;
    overflow-y: auto;
    border-bottom: 0;
    border-right: 1px solid var(--border);
    padding: 20px 16px;
    gap: 8px;
  }
  .rail .rail-title {
    display: block;
    font-family: var(--font-display); font-weight: 700; font-size: 13px;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
    padding: 0 8px 6px;
  }
  .subject { width: 100%; font-size: 16px; padding: 12px 16px; }
  .msg { max-width: 680px; }
}

/* ================================================================ desktop */
@media (min-width: 1024px) {
  .main { grid-template-columns: 260px minmax(0, 1fr); }
  .stream { padding: 30px clamp(26px, 5vw, 60px); }
  .msg { max-width: 760px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  .stream { scroll-behavior: auto; }
}

</style>
</head>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 1 3 6.7L3 16"/><path d="M3 21v-5h5"/></svg>

      <nav class="rail" aria-label="Choose a subject">
        <span class="rail-title">Subjects</span>
        <button class="subject" data-subject="math"    data-label="Math"     aria-pressed="false" type="button"></button>
        <button class="subject" data-subject="reading" data-label="Reading"  aria-pressed="false" type="button"></button>
        <button class="subject" data-subject="science" data-label="Science"  aria-pressed="false" type="button"></button>
        <button class="subject" data-subject="curio"   data-label="Curiosity" aria-pressed="false" type="button"></button>
      </nav>

      <section class="chat" aria-label="Chat with Sparkle the tutor">

            </label>
            <button class="send" id="send" type="submit" aria-label="Send"></button>
          </form>
        </div>
      </section>
    </div>
  </div>

    function extractWord(text){let m=text.match(/["'“](\w+)["'”]/);if(m)return m[1];m=text.match(/spell\s+(?:the\s+word\s+)?([a-zA-Z]{2,})/i);if(m)return m[1];m=text.match(/write\s+([a-zA-Z]{2,})/i);if(m)return m[1];const words=text.match(/[a-zA-Z]{3,}/g)||[];const stop={how:1,you:1,spell:1,the:1,word:1,write:1,sound:1,out:1,does:1,what:1,letters:1,and:1,can:1};const cand=words.filter((w)=>!stop[w.toLowerCase()]);return cand.length?cand[cand.length-1]:null;}
    function letterTilesHTML(word){const vowels='aeiou';const tiles=word.split('').map((ch,i)=>'<span class="tile'+(vowels.includes(ch.toLowerCase())?' vowel':'')+'" style="animation-delay:'+(i*0.06)+'s">'+esc(ch.toUpperCase())+'</span>').join('');return '<div class="aid"><h4>'+I.reading+'Letter tiles — yellow ones are vowels (a, e, i, o, u)</h4><div class="tiles">'+tiles+'</div></div>';}
    function readingPlan(word){
      if(!word)return{intro:'Let\'s sound it out together! Tell me the word you want to spell and I\'ll help you break it into sounds.',steps:[{q:'Say the word slowly out loud. How many <strong>sounds</strong> can you hear?',tip:'Stretch it like bubble gum: c-a-t.'},{q:'What letter makes the <strong>first</strong> sound?',tip:'Just the beginning sound for now.'}],answer:null,answerLine:'Type the word in quotes, like "rabbit", and we\'ll build it letter by letter!'};
      const w=word.toLowerCase();return{intro:'Let\'s spell <strong>'+esc(word)+'</strong> by listening to its sounds — I\'ll guide, you build!',aid:letterTilesHTML(w),steps:[{q:'Say <strong>'+esc(word)+'</strong> slowly and stretch it. How many sounds do you hear?',tip:'Clap once for each sound.'},{q:'What letter makes the <strong>first</strong> sound in <strong>'+esc(word)+'</strong>?',tip:'Look at the first tile above.',check:w[0]},{q:'Now listen for the <strong>middle</strong> sound. Which vowel do you hear? (the yellow tiles)',tip:'Vowels are a, e, i, o, u.'},{q:'Put every sound in order. Can you say all the letters of <strong>'+esc(word)+'</strong>?',tip:'Point to each tile as you say it.',check:w}],answer:word,answerLine:'You built it! <strong>'+esc(word).toUpperCase().split('').join('-')+'</strong> spells <strong>'+esc(word)+'</strong>. Super sounding-out! 🌟'};
    }
    const scienceTopics=[
      {keys:['sky','blue'],intro:'Ooh, the blue sky — a great wonder! Let\'s discover the reason together instead of me just telling you.',diagram:sunSkyDiagram(),steps:[{q:'Sunlight looks white, but it\'s secretly made of many colors. Where have you seen sunlight split into colors before?',tip:'Think of a rainbow after rain. 🌈'},{q:'The air is full of tiny bits. Some colors bounce around the sky more than others. Which color do you think bounces the most — red or blue?',tip:'The one that scatters everywhere fills the whole sky.'},{q:'So if blue light bounces all around the sky, what color would your eyes see when you look up?',tip:'You\'re almost there!'}],answer:'Blue light scatters the most, so it bounces all around the sky and that\'s the color we see. 🌟'},
      {keys:['rain','water cycle','cloud'],intro:'Where does rain come from? Let\'s trace the water\'s journey step by step!',diagram:waterCycleDiagram(),steps:[{q:'When the sun warms a puddle or the sea, the water turns into an invisible gas and floats up. What do you think that\'s called?',tip:'It\'s like steam rising from a warm bath.'},{q:'Up high the air is cold. When the water gas gets cold, it turns back into tiny drops and gathers together. What do lots of tiny drops make in the sky?',tip:'You can see them on a fluffy day.'},{q:'When a cloud gets heavy with too many drops, what do you think happens next?',tip:'What comes down when clouds are full?'}],answer:'Water evaporates → gathers into clouds → falls as rain. That\'s the water cycle! 🌟'},
      {keys:['float','sink'],intro:'Why do some things float and others sink? Let\'s experiment with our thinking!',diagram:floatDiagram(),steps:[{q:'Think of a big heavy boat and a tiny pebble. Which one floats?',tip:'It\'s not only about being heavy!'},{q:'A boat is hollow and full of air, spreading its weight over lots of water. Does spreading out help it float or sink?',tip:'Air is very light.'},{q:'So what matters more — how heavy something is, or how much water it pushes out of the way?',tip:'This is the big idea!'}],answer:'Things float when they push away enough water to hold them up — it\'s about shape and spread, not just weight. 🌟'}
    ];
    function scienceGeneric(){return{intro:'What a curious question! Great scientists start by wondering. Let\'s explore it like detectives. 🔎',steps:[{q:'What do you already <strong>know</strong> about this?',tip:'Even a small clue helps.'},{q:'What do you <strong>notice</strong> or observe when it happens?',tip:'Use your senses — what do you see or hear?'},{q:'What\'s your best <strong>guess</strong> for why? A guess in science is called a hypothesis!',tip:'There are no silly guesses — scientists guess and then test.'}],answer:null,answerLine:'Tell me your guess and I\'ll help you check if it\'s on the right track!'};}
    function sciencePlan(text){const t=text.toLowerCase();const hit=scienceTopics.find((tp)=>tp.keys.some((k)=>t.includes(k)));if(hit)return{intro:hit.intro,aid:hit.diagram,steps:hit.steps,answer:hit.answer,answerLine:hit.answer};return scienceGeneric();}
    function sunSkyDiagram(){return '<div class="aid"><h4>'+I.science+'Sunlight scattering in the sky</h4><div class="diagram"><svg viewBox="0 0 360 200" role="img" aria-label="The sun sending light rays that scatter into blue across the sky"><rect x="0" y="0" width="360" height="200" rx="12" fill="oklch(92% 0.05 235)"/><circle cx="60" cy="60" r="26" fill="oklch(85% 0.14 85)"/><g stroke="oklch(80% 0.14 85)" stroke-width="3" stroke-linecap="round"><line x1="60" y1="18" x2="60" y2="4"/><line x1="26" y1="60" x2="12" y2="60"/><line x1="36" y1="36" x2="26" y2="26"/></g><g stroke-width="3" stroke-linecap="round" fill="none"><path d="M86 60 Q160 60 250 70" stroke="oklch(60% 0.15 235)"/><path d="M86 66 Q170 90 270 110" stroke="oklch(60% 0.15 235)"/><path d="M86 54 Q180 40 300 55" stroke="oklch(60% 0.15 235)"/></g><circle cx="250" cy="70" r="5" fill="oklch(55% 0.18 235)"/><circle cx="270" cy="110" r="5" fill="oklch(55% 0.18 235)"/><circle cx="300" cy="55" r="5" fill="oklch(55% 0.18 235)"/><text x="180" y="180" text-anchor="middle" font-family="Nunito,sans-serif" font-size="15" font-weight="700" fill="oklch(45% 0.1 235)">Blue light bounces everywhere</text></svg></div></div>';}
    function waterCycleDiagram(){return '<div class="aid"><h4>'+I.science+'The water cycle</h4><div class="diagram"><svg viewBox="0 0 360 210" role="img" aria-label="Water evaporates from the sea, forms a cloud, and falls as rain"><rect x="0" y="0" width="360" height="210" rx="12" fill="oklch(94% 0.04 235)"/><path d="M0 170 Q60 160 120 170 T240 170 T360 170 V210 H0 Z" fill="oklch(70% 0.11 235)"/><circle cx="70" cy="45" r="22" fill="oklch(85% 0.14 85)"/><g fill="oklch(88% 0.02 235)"><ellipse cx="240" cy="50" rx="42" ry="22"/><ellipse cx="270" cy="42" rx="30" ry="18"/><ellipse cx="210" cy="44" rx="26" ry="16"/></g><g stroke="oklch(60% 0.13 235)" stroke-width="3" stroke-linecap="round" fill="none" stroke-dasharray="2 7"><path d="M120 165 C120 120 150 100 190 75"/></g><g stroke="oklch(55% 0.16 235)" stroke-width="3" stroke-linecap="round"><line x1="215" y1="70" x2="208" y2="95"/><line x1="240" y1="72" x2="235" y2="100"/><line x1="265" y1="70" x2="260" y2="95"/></g><text x="120" y="150" text-anchor="middle" font-family="Nunito,sans-serif" font-size="13" font-weight="700" fill="oklch(45% 0.1 235)">evaporate</text><text x="240" y="26" text-anchor="middle" font-family="Nunito,sans-serif" font-size="13" font-weight="700" fill="oklch(45% 0.1 235)">cloud</text><text x="240" y="125" text-anchor="middle" font-family="Nunito,sans-serif" font-size="13" font-weight="700" fill="oklch(45% 0.14 235)">rain</text></svg></div></div>';}
    function floatDiagram(){return '<div class="aid"><h4>'+I.science+'Float or sink?</h4><div class="diagram"><svg viewBox="0 0 360 190" role="img" aria-label="A hollow boat floating while a small pebble sinks in water"><rect x="0" y="0" width="360" height="190" rx="12" fill="oklch(94% 0.04 235)"/><rect x="0" y="80" width="360" height="110" fill="oklch(80% 0.09 220)" opacity="0.55"/><path d="M60 78 h90 l-16 26 h-58 z" fill="oklch(66% 0.16 32)"/><line x1="105" y1="78" x2="105" y2="50" stroke="oklch(45% 0.05 265)" stroke-width="3"/><path d="M105 52 l26 12 -26 8 z" fill="oklch(64% 0.11 195)"/><circle cx="270" cy="150" r="10" fill="oklch(45% 0.05 265)"/><g stroke="oklch(50% 0.05 265)" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 5"><line x1="270" y1="90" x2="270" y2="138"/></g><text x="105" y="128" text-anchor="middle" font-family="Nunito,sans-serif" font-size="13" font-weight="700" fill="#fff">floats</text><text x="270" y="178" text-anchor="middle" font-family="Nunito,sans-serif" font-size="13" font-weight="700" fill="oklch(40% 0.05 265)">sinks</text></svg></div></div>';}
    function curioPlan(){return{intro:'I love big wonder questions! Instead of just answering, let\'s think it through together. 🤔',steps:[{q:'What made you curious about this? What have you seen or heard about it?',tip:'Your own experience is a great starting clue.'},{q:'If you had to make your best guess right now, what would you say — and why?',tip:'Guessing is how thinking starts!'},{q:'How could we <strong>find out</strong> if your guess is right? Ask a grown-up, read a book, or try a little test?',tip:'Good thinkers know how to check their ideas.'}],answer:null,answerLine:'Share your best guess with me and I\'ll help you think about whether it makes sense!'};}
    function buildPlan(subject,text){if(subject==='math'){const expr=parseArithmetic(text);return expr?mathPlan(expr):mathFallback();}if(subject==='reading')return readingPlan(extractWord(text));if(subject==='science')return sciencePlan(text);return curioPlan();}
    let active=null;
    function renderTurn(plan){
      active={plan:plan,revealed:1,stepEls:[]};
      const bubble=addMsg('tutor',function(b){
        const lead=document.createElement('p');lead.className='lead';lead.innerHTML=plan.intro;b.appendChild(lead);
        if(plan.aid){const aid=document.createElement('div');aid.innerHTML=plan.aid;b.appendChild(aid.firstElementChild);}
        const steps=document.createElement('div');steps.className='steps';
        plan.steps.forEach((s,i)=>{const step=document.createElement('div');step.className='step'+(i===0?' revealed current':'');step.innerHTML='<div class="num">'+(i+1)+'</div><div class="body"><div class="q">'+s.q+'</div><div class="tip">'+I.bulb.replace('width="1.8"','')+' '+s.tip+'</div></div>';steps.appendChild(step);active.stepEls.push(step);});
        b.appendChild(steps);
        const chips=document.createElement('div');chips.className='chips';
        const hint=document.createElement('button');hint.className='chip hint';hint.type='button';hint.innerHTML=I.bulb+'I need a hint';hint.addEventListener('click',onHint);
        const next=document.createElement('button');next.className='chip';next.type='button';next.innerHTML=I.check+'Show next step';next.addEventListener('click',onNextStep);
        const reveal=document.createElement('button');reveal.className='chip reveal';reveal.type='button';reveal.innerHTML=I.key+'I tried — reveal the answer';reveal.addEventListener('click',onReveal);
        chips.appendChild(next);chips.appendChild(hint);if(plan.answer!==null||plan.answerLine)chips.appendChild(reveal);
        b.appendChild(chips);active.chipsEl=chips;active.nextBtn=next;
      });
      active.bubble=bubble;
    }
    function onNextStep(){
      if(!active)return;const p=active.plan;const curEl=active.stepEls[active.revealed-1];if(curEl){curEl.classList.remove('current');curEl.classList.add('done');}
      if(active.revealed<p.steps.length){const el=active.stepEls[active.revealed];el.classList.add('revealed','current');active.revealed++;el.animate([{transform:'translateY(8px)',opacity:.4},{transform:'none',opacity:1}],{duration:260,easing:'ease'});scrollDown();}
      else{active.nextBtn.disabled=true;active.nextBtn.style.opacity=.4;addCheer('You worked through every step — amazing thinking!','ok');}
    }
    const hintLadder=['Take your time — read the highlighted step again slowly. What is it asking you to do first?','Try using the picture above. Point to each piece as you count or sound it out.','You\'re close! Whisper your idea out loud — saying it helps your brain check it.'];
    let hintLevel=0;
    function onHint(){if(!active)return;const step=active.plan.steps[active.revealed-1];const specific=step&&step.tip;let msg;if(hintLevel===0&&specific){msg=specific;}else{msg=hintLadder[Math.min(hintLevel,hintLadder.length-1)];}hintLevel++;addMsg('tutor','<p class="lead">'+I.bulb.replace('width="1.8"','')+' Here\'s a little hint…</p><p>'+msg+'</p>');}
    function onReveal(){
      if(!active)return;const p=active.plan;active.stepEls.forEach((el)=>el.classList.add('revealed','done'));active.stepEls.forEach((el)=>el.classList.remove('current'));
      addMsg('tutor',function(b){const l=document.createElement('p');l.className='lead';l.innerHTML=I.key.replace('width="1.8"','')+' You gave it a real try — here\'s how it all comes together:';b.appendChild(l);const ans=document.createElement('p');ans.style.marginTop='8px';ans.innerHTML=p.answerLine||('The answer is <strong>'+p.answer+'</strong>.');b.appendChild(ans);const tail=document.createElement('p');tail.style.marginTop='8px';tail.style.color='var(--muted)';tail.textContent='Want to try another one? I\'m ready when you are!';b.appendChild(tail);});
      active=null;hintLevel=0;
    }
    function tryValidate(text){
      if(!active)return false;const step=active.plan.steps[active.revealed-1];if(!step||step.check===undefined)return false;
      const guess=text.trim().toLowerCase();const want=String(step.check).toLowerCase();const numGuess=(guess.match(/-?\d+/)||[])[0];let correct=false;
      if(typeof step.check==='number')correct=numGuess!==undefined&&+numGuess===step.check;else correct=guess===want||guess.replace(/[\s\-]/g,'')===want.replace(/[\s\-]/g,'');
      if(correct){const cheers=['Yes! That\'s exactly right!','You got it! 🎉','Spot on — great reasoning!','Brilliant! That\'s correct!'];addCheer(cheers[Math.floor(Math.random()*cheers.length)],'ok');setTimeout(onNextStep,350);}
      else{addCheer('So close — not quite yet. Take another look and try again!','try');setTimeout(onHint,350);}
      return true;
    }
    function handleUserText(text){
      text=text.trim();if(!text)return;addMsg('you',esc(text));
      if(tryValidate(text))return;
      const subject=forcedSubject||detectSubject(text);highlightSubject(subject);const think=thinking();
      setTimeout(()=>{think.remove();hintLevel=0;renderTurn(buildPlan(subject,text));},650);
    }
    let forcedSubject=null;
    function highlightSubject(subject){$$('.subject').forEach((b)=>b.setAttribute('aria-pressed',String(b.dataset.subject===subject)));}
    const subjectPrompts={
      math:{placeholder:'Ask me a math question, like "How do I calculate 25 + 17?"',suggests:['How do I calculate 25 + 17?','What is 43 − 18?','What is 6 × 4?']},
      reading:{placeholder:'Ask me to help you spell a word, like spell "rabbit"',suggests:['How do you spell "rabbit"?','Help me sound out "sunshine"','Spell "friend"']},
      science:{placeholder:'Ask me a science question, like "Why is the sky blue?"',suggests:['Why is the sky blue?','Where does rain come from?','Why do boats float?']},
      curio:{placeholder:'Ask me anything you\'re curious about!',suggests:['Why do we dream?','How do birds know where to fly?','Why do we have to sleep?']}
    };
    function setSubject(subject){forcedSubject=subject;highlightSubject(subject);const cfg=subjectPrompts[subject];$('#input').placeholder=cfg.placeholder;renderSuggests(cfg.suggests);}
    function renderSuggests(list){const box=$('#suggests');box.innerHTML='';list.forEach((s)=>{const b=document.createElement('button');b.type='button';b.textContent=s;b.addEventListener('click',()=>{handleUserText(s);});box.appendChild(b);});}
    function welcome(){
      addMsg('tutor',function(b){
        b.innerHTML='<p class="lead">Hi! I\'m Sparkle, your thinking buddy. ✨</p><p style="margin-top:8px">I won\'t just give you answers — I\'ll help you <strong>figure them out</strong> with little steps and hints. Pick a subject, or just ask me anything!</p>';
        const chips=document.createElement('div');chips.className='chips';
        [['math','Math'],['reading','Reading'],['science','Science'],['curio','Curiosity']].forEach(([s,label])=>{const c=document.createElement('button');c.className='chip';c.type='button';c.innerHTML=I[s]+label;c.addEventListener('click',()=>setSubject(s));chips.appendChild(c);});
        b.appendChild(chips);
      });
    }
    function init(){
      $$('.subject').forEach((btn)=>{btn.innerHTML='<span class="ic">'+I[btn.dataset.subject]+'</span><span class="label">'+btn.dataset.label+'</span>';btn.addEventListener('click',()=>setSubject(btn.dataset.subject));});
      $('#send').innerHTML=I.send;
      const form=$('#composer');const input=$('#input');
      function submit(){const v=input.value;input.value='';input.style.height='auto';handleUserText(v);}
      form.addEventListener('submit',(e)=>{e.preventDefault();submit();});
      input.addEventListener('keydown',(e)=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submit();}});
      input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,120)+'px';$('#send').disabled=!input.value.trim();});
      $('#send').disabled=true;
      $('#reset').addEventListener('click',()=>{stream.innerHTML='';active=null;forcedSubject=null;hintLevel=0;highlightSubject(null);welcome();renderSuggests(['How do I calculate 25 + 17?','How do you spell "rabbit"?','Why is the sky blue?','Why do we dream?']);input.placeholder='Ask me anything, like "How do I calculate 25 + 17?"';});
      welcome();
      renderSuggests(['How do I calculate 25 + 17?','How do you spell "rabbit"?','Why is the sky blue?','Why do we dream?']);
    }
    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
  })();
  </script>
</body>
</html>
