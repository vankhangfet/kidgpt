<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sparkle Tutor — bạn đồng hành suy nghĩ</title>
  <meta name="description" content="Trợ lý AI thân thiện cho trẻ 6–12 tuổi: hướng dẫn tìm đáp án từng bước cùng hình minh họa — không bao giờ đưa đáp án ngay." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="games.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/><circle cx="12" cy="12" r="3.2"/>
          </svg>
        </span>
        <span>Sparkle Tutor<small id="tagline">Mình giúp bạn nghĩ — không chỉ trả lời</small></span>
      </div>
      <span class="spacer"></span>
      <button class="btn-ghost profile-chip" id="profileChip" type="button" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-3.3 3.6-6 8-6s8 2.7 8 6"/></svg>
        <span class="chip-name" id="profileChipName"></span>
      </button>
      <button class="btn-ghost lang-toggle" id="langToggle" type="button" aria-label="Change language">EN</button>
      <button class="btn-ghost" id="reset" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 1 3 6.7L3 16"/><path d="M3 21v-5h5"/></svg>
        <span id="resetLabel">Bắt đầu lại</span>
      </button>
    </header>

    <div class="main">
      <nav class="rail" id="rail" aria-label="Chọn chủ đề"></nav>

      <section class="chat" id="chatView" aria-label="Chat với Sparkle">
        <div class="stream" id="stream" role="log" aria-live="polite"></div>

        <div class="composer">
          <div class="suggests" id="suggests"></div>
          <form id="composer" autocomplete="off">
            <label class="field">
              <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Nhập câu hỏi</span>
              <textarea id="input" rows="1"></textarea>
            </label>
            <button class="send" id="send" type="submit" aria-label="Gửi"></button>
          </form>
        </div>
      </section>

      <section class="games" id="gamesView" aria-label="Trò chơi" hidden></section>
    </div>
  </div>

  <script type="module" src="app.js"></script>
  <div class="gate" id="gate" role="dialog" aria-modal="true" aria-label="Sparkle Tutor" hidden></div>
</body>
</html>
